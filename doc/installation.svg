<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 122" width="654" height="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .group { fill: #f6f8fa; stroke: #d0d7de; }
    .node  { fill: #ddf4ff; stroke: #54aeff; }
    .zip   { fill: #fff8c5; stroke: #d4a72c; }
    .title { fill: #59636e; font-weight: 600; font-size: 13px; }
    .label { fill: #1f2328; }
    .edge  { stroke: #59636e; }
    .head  { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .group { fill: #151b23; stroke: #3d444d; }
      .node  { fill: #0c2d6b; stroke: #1f6feb; }
      .zip   { fill: #3b2e0a; stroke: #9e6a03; }
      .title { fill: #9198a1; }
      .label { fill: #f0f6fc; }
      .edge  { stroke: #9198a1; }
      .head  { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Workstation -->
  <rect class="group" x="1" y="1" width="290" height="120" rx="10"/>
  <text class="title" x="16" y="24">Workstation</text>
  <rect class="node" x="16" y="46" width="140" height="50" rx="6"/>
  <text class="label" x="86" y="75.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">python build.py</text>
  <line class="edge" x1="156" y1="71" x2="173" y2="71" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="zip" x="174" y="46" width="102" height="50" rx="6"/>
  <text class="label" x="225" y="76" text-anchor="middle">ZIP package</text>

  <!-- MR scanner -->
  <rect class="group" x="372" y="1" width="281" height="120" rx="10"/>
  <text class="title" x="387" y="24">MR scanner (XA60+)</text>
  <rect class="node" x="387" y="46" width="100" height="50" rx="6"/>
  <text class="label" x="437" y="76" text-anchor="middle">Install</text>
  <line class="edge" x1="487" y1="71" x2="511" y2="71" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect class="node" x="512" y="46" width="126" height="50" rx="6"/>
  <text class="label" x="575" y="76" text-anchor="middle">Run protocol</text>

  <!-- USB -->
  <line class="edge" x1="276" y1="71" x2="386" y2="71" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="title" x="331" y="63" text-anchor="middle">USB</text>
</svg>
